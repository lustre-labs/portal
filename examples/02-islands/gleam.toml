name = "app"
version = "1.0.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
lustre = ">= 5.2.1 and < 6.0.0"
lustre_portal = { path = "../../" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.3.5 and < 3.0.0"

[tools.lustre.html]
body = """
<div class="grid grid-cols-[2fr_3fr] grid-rows-[4rem_1fr]">
    <h1 class="col-span-2 text-2xl font-semibold p-2">
        Welcome to our hybrid app
    </h1>
    <div class="grid grid-cols-subgrid col-span-2">
        <aside class="p-2">
            <h2>This is server-rendered static markup.</h2>
            <div id="sidebar"></div>
        </aside>
        <main id="app" class="p-2"></main>
    </div>
</div>
"""
